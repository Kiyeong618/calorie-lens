name: Deploy CalorieLens Terrain Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official site
        uses: actions/checkout@v4
        with:
          ref: main
          path: official
      - name: Checkout terrain preview
        uses: actions/checkout@v4
        with:
          ref: codex/calorielens
          path: terrain
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: terrain/package-lock.json
      - name: Build official site
        working-directory: official
        run: npm ci && npm run build
      - name: Build terrain preview
        working-directory: terrain
        run: npm ci && npm run build
      - name: Create Pages artifact
        shell: bash
        run: |
          mkdir -p public/terrain
          cp -R official/dist/. public/
          cp -R terrain/dist/. public/terrain/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
